name: Build and Deploy APSA 2026 Program

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Same pinned image the local freeze:docker script uses, so goldens render
    # byte-identically here and on the dev machine. Must match the exact
    # @playwright/test version in app/package.json.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the mobile-freeze tag is needed for the golden guard

      - name: Goldens are frozen
        # The mobile goldens were captured from production behavior and must
        # not change during desktop work. Re-baselining is a deliberate act:
        # move the mobile-freeze tag in the same PR that updates the goldens.
        run: |
          git config --global --add safe.directory "$PWD"
          if git rev-parse -q --verify mobile-freeze >/dev/null; then
            git diff --exit-code mobile-freeze -- app/tests/visual/__screenshots__
          else
            echo "mobile-freeze tag not found; skipping guard"
          fi

      - name: Install dependencies
        run: npm ci
        working-directory: app
        env:
          HOME: /root

      - name: Run tests
        run: npx playwright test
        working-directory: app
        env:
          HOME: /root

      - name: Upload failure diffs and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            app/test-results/
            app/playwright-report/
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Build
        run: npm run build
        working-directory: app

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
